&lt;body&gt;
  &lt;div class=&quot;shell&quot;&gt;
    &lt;header&gt;
      &lt;div class=&quot;brand&quot;&gt;
        &lt;div class=&quot;seal&quot; aria-hidden=&quot;true&quot;&gt;☯&lt;/div&gt;
        &lt;div&gt;
          &lt;h1 data-i18n=&quot;brand&quot;&gt;易经调式合成实验室&lt;/h1&gt;
          &lt;p data-i18n=&quot;tagline&quot;&gt;I CHING TRICHORD &amp;amp; MODAL SYNTHESIS LAB&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;header-actions&quot;&gt;
        &lt;button class=&quot;thin-button&quot; id=&quot;langButton&quot; type=&quot;button&quot; aria-label=&quot;Switch language&quot;&gt;EN&lt;/button&gt;
        &lt;button class=&quot;thin-button&quot; type=&quot;button&quot; onclick=&quot;document.getElementById('matrix').scrollIntoView({behavior:'smooth'})&quot; data-i18n=&quot;matrixJump&quot;&gt;64 调式矩阵&lt;/button&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;main&gt;
      &lt;section class=&quot;research-section&quot; id=&quot;yijingIntro&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;YIJING · RESEARCH CONTEXT&lt;/p&gt;&lt;h2&gt;易经与研究背景&lt;/h2&gt;&lt;p&gt;从阴阳符号到当代音乐：张睿哲 Ruizhe Zhang 的实践研究&lt;/p&gt;&lt;p&gt;《易经》（Yijing / I Ching，Book of Changes）以变化为核心。阴爻为断线，阳爻为实线；三爻组合构成八卦，上下两个八卦组合构成六十四卦。卦象既提供象征图像，也为讨论情境与转变提供结构。&lt;/p&gt;&lt;p&gt;在本研究中，传统符号成为创作的起点：阴阳影响音程与发音，八卦形成三音列，上下卦生成音场，动爻驱动横向声部变化。音高、配器和文化调式的对应属于本研究的创作定义，不能直接当作古代《易经》的音乐规定。&lt;/p&gt;&lt;div class=&quot;research-cards&quot;&gt;&lt;span&gt;象：音响形态与文化意象&lt;/span&gt;&lt;span&gt;数：爻位、组合与参数&lt;/span&gt;&lt;span&gt;理：材料发展与变化逻辑&lt;/span&gt;&lt;span&gt;占：材料选择与生成过程&lt;/span&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;循环叙事与研究方法&lt;/summary&gt;&lt;p&gt;RP1 将无极、太极、两仪、四象、八卦、六十四卦组织为宏观音乐叙事，并以实践导向的质性研究、作品分析、访谈和创作记录发展系统。网站进一步展示三音列、声部滑动与跨文化调式的更新方案。早期作品与当前规则属于不同迭代阶段。&lt;/p&gt;&lt;p&gt;Wuji → Taiji → Liangyi → Sixiang → Bagua → 64 Hexagrams → Wuji&lt;/p&gt;&lt;/details&gt;&lt;p&gt;&lt;a href=&quot;https://video.afe.easia.columbia.edu/teaching-guides/the-yijing-teaching-guide/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;阅读基础介绍&lt;/a&gt; · &lt;a href=&quot;#researchSources&quot;&gt;来源与原创边界&lt;/a&gt;&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;research-section&quot; id=&quot;sevenStageCycle&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;WUJI → TAIJI → LIANGYI → SIXIANG → BAGUA → 64 HEXAGRAMS → WUJI&lt;/p&gt;&lt;h2&gt;七阶段生成与回归循环&lt;/h2&gt;&lt;p&gt;单首作品与整个作品集均可使用；适用于声学、电子与混合媒介。&lt;/p&gt;&lt;p&gt;六个演化阶段，加上第七个“归无极”闭环位置。六十四卦是第六阶段，不能替代整个七阶段体系。&lt;/p&gt;&lt;div class=&quot;research-grid&quot;&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;单首作品的曲式结构&lt;/h3&gt;&lt;p&gt;在同一首作品中，将七阶段作为段落、乐章或贯穿发展的结构功能。各阶段时长由音乐需要决定；不要求平均分配。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;作品集的大循环&lt;/h3&gt;&lt;p&gt;让不同作品或组曲承担不同阶段，连成无极到归无极的大循环。《太初》作为无极阶段的开端与锚定案例；其他阶段可由后续作品展开。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;媒介与编制开放&lt;/h3&gt;&lt;p&gt;室内乐、交响乐、纯电子音乐、声学乐器与电子音乐结合，以及世界乐器参与的混合形式均可承载本体系。具体编制依作品构思与资源决定。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;seven-stage-list&quot;&gt;&lt;article data-stage=&quot;1&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #adb6bd;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;1. &lt;span&gt;无极 Wuji&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;混沌未分、无形与不确定音响。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;自由或无节拍节奏；噪音织体、环境音、非固定音高；刮奏、特殊拨弦、气鸣与敲击；非线性、弥散开篇。《太初》对应本阶段。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;2&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #78b9e0;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;2. &lt;span&gt;太极 Taiji&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;从混沌中建立可感知的阴阳二元与极化张力。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;三全音轴（如 C 与 F♯）、三全音与纯五度对置、半音与全音音场对置；持续共振与碎片点描形成两个张力场。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;3&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #ddbe5e;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;3. &lt;span&gt;两仪 Liangyi&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;对立元素交织、对话、追逐与相互渗透。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;阳的连续旋律与阴的断奏点描交互；对话、模仿与对位；规则律动和不规则节奏叠置；冲突和声逐步融合。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;4&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #69ae9f;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;4. &lt;span&gt;四象 Sixiang&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;四季意象与四种独立音乐性格。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;四种调式或音色组：中国五声、印度拉格、中古调式、人工音阶等文化参照；四度叠置、速度与情绪对照；可顺次铺陈或平行叠加。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;5&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #d88b55;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;5. &lt;span&gt;八卦 Bagua&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;八种文化编码的音乐语汇与三音列核心。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;按更新规则构建八组三音列：乾 [1–2–3]、坤半音簇、震 [5–1–♭2]、巽 [3–4–6]、坎 [5–6–7]、离 [1–♭3–3]、艮 [2–♭3–5]、兑 [6–1–2]；同时定义节奏、技法与文化取向。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;6&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #cf716f;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;6. &lt;span&gt;六十四卦 64 Hexagrams&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;双三音列复合、多调式与最大化复调。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;上下卦复合为音场，扩展跨文化人工调式；多调性、泛调性、复合节奏及频谱密度叠加；动爻以单音滑动连接调式，形成循环发展的复杂顶点。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article data-stage=&quot;7&quot; style=&quot;padding:18px;margin-top:12px;border-left:3px solid #9f7bcc;background:rgba(13,27,26,.5)&quot;&gt;&lt;h3&gt;7. &lt;span&gt;归无极 Return to Wuji&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;哲学与音响&lt;/strong&gt;&lt;br&gt;&lt;span&gt;从复杂性消解回混沌、噪音或静默。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;作曲规则&lt;/strong&gt;&lt;br&gt;&lt;span&gt;逐渐消退与简化、音高模糊、节奏消散、音色解体；呼应开篇，完成单曲或作品集的循环闭合。归无极是第七个结构位置，与初始无极相呼应。&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p style=&quot;font-size:.72rem&quot;&gt;来源：research aims 汇报中的生成循环、锚定作品与编制灵活性；研究PPT第10–14页的阶段技法、第16–19页的作品与交响／电子方案；以及作者本次明确的七阶段应用方式。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;research-section&quot; id=&quot;primordialCase&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;PORTFOLIO · COMPOSITION CASE&lt;/p&gt;&lt;h2&gt;《太初》：无极阶段的作品案例&lt;/h2&gt;&lt;div class=&quot;case-layout&quot;&gt;&lt;img src=&quot;assets/Primordial-cover.png&quot; alt=&quot;Primordial 太初 — Ruizhe Zhang — 2024&quot; loading=&quot;lazy&quot;&gt;&lt;div&gt;&lt;h3&gt;太初 Primordial · 琵琶与弦乐四重奏 · 2024&lt;/h3&gt;&lt;p&gt;作曲：张睿哲 Ruizhe Zhang · 乐谱27页 · 标注时长6分7秒&lt;/p&gt;&lt;p&gt;根据乐谱中的作品说明，《太初》通过琵琶与弦乐的碰撞、流动的五声与七声旋律，以及动静对照表现本原意象。其叙事从混沌开端，经由中段爆发，回到平静的原始状态。&lt;/p&gt;&lt;label for=&quot;primordialAudio&quot;&gt;播放你提供的音频&lt;/label&gt;&lt;audio id=&quot;primordialAudio&quot; controls preload=&quot;metadata&quot; src=&quot;assets/Primordial.mp3&quot;&gt;&lt;/audio&gt;&lt;p style=&quot;font-size:.72rem&quot;&gt;音频由作者提供；录音演奏者与制作方式未在本页另行署名。&lt;/p&gt;&lt;div class=&quot;case-links&quot;&gt;&lt;a class=&quot;button&quot; href=&quot;assets/Primordial-score.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;打开完整乐谱&lt;/a&gt;&lt;a class=&quot;button&quot; href=&quot;assets/Primordial.mp3&quot; download&gt;下载音频&lt;/a&gt;&lt;a class=&quot;button&quot; href=&quot;assets/Primordial-score.pdf#page=2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;阅读作品说明（PDF第2页）&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;阶段定位：无极。作品表现混乱的开始，以琵琶与弦乐四重奏探索未分化音响、扩展技法与本原意象。该作品的内部发展属于无极阶段的音响实践；它不按六十四卦逐一对应，也不承担整个七阶段循环。&lt;/p&gt;&lt;div class=&quot;research-grid&quot;&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;混沌开端&lt;/h3&gt;&lt;p&gt;乐谱开端标示 Largo、♩=48、rubato 与 veiled；可结合谱面观察零散事件、休止与拨弦／拉弦转换。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;音色碰撞与发展&lt;/h3&gt;&lt;p&gt;技法说明包含琵琶的拍、提、摘、弹面板、轮与长轮，以及弦乐左手拨弦。它们为音响与手势研究提供具体材料。&lt;/p&gt;&lt;a href=&quot;assets/Primordial-score.pdf#page=3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;演奏技法说明（PDF第3–4页）&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;无极阶段内部的音响发展 / Sonic development within Wuji&lt;/h3&gt;&lt;p&gt;阶段定位：无极。作品表现混乱的开始，以琵琶与弦乐四重奏探索未分化音响、扩展技法与本原意象。该作品的内部发展属于无极阶段的音响实践；它不按六十四卦逐一对应，也不承担整个七阶段循环。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;开端谱面预览（PDF第5页）&lt;/summary&gt;&lt;img class=&quot;score-preview&quot; loading=&quot;lazy&quot; src=&quot;assets/Primordial-opening.png&quot; alt=&quot;Primordial opening score, PDF page 5&quot;&gt;&lt;p&gt;原始乐谱保留原有标记；预览只是阅读辅助。&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;hero&quot; aria-labelledby=&quot;hero-title&quot;&gt;
        &lt;div class=&quot;hero-copy&quot;&gt;
          &lt;p class=&quot;eyebrow&quot; data-i18n=&quot;eyebrow&quot;&gt;Practice-led composition prototype&lt;/p&gt;
          &lt;h2 id=&quot;hero-title&quot; data-i18n-html=&quot;heroTitle&quot;&gt;把 &lt;span&gt;三爻&lt;/span&gt; 变成三音列，&lt;br&gt;让 &lt;span&gt;六爻&lt;/span&gt; 生长为调式与声部进行。&lt;/h2&gt;
          &lt;p data-i18n=&quot;heroText&quot;&gt;这是一个面向作品集创作的规则原型：下卦给出室内乐基础三音列，上卦给出独奏声部三音列；两者耦合成为六音列或可扩展调式。动爻不被当作命运判断，而被转译为可听见、可标注的横向声部滑动。&lt;/p&gt;
          &lt;div class=&quot;hero-meta&quot;&gt;
            &lt;span class=&quot;chip&quot; data-i18n=&quot;chip1&quot;&gt;微观：阴阳 → 音程 / 发音&lt;/span&gt;
            &lt;span class=&quot;chip&quot; data-i18n=&quot;chip2&quot;&gt;中观：八卦 → 三音列&lt;/span&gt;
            &lt;span class=&quot;chip&quot; data-i18n=&quot;chip3&quot;&gt;宏观：重卦 → 调式世界&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;aside class=&quot;aim-card&quot;&gt;
          &lt;div&gt;
            &lt;h3 data-i18n=&quot;aimTitle&quot;&gt;研究锚点 / Research anchor&lt;/h3&gt;
            &lt;p data-i18n=&quot;aimText&quot;&gt;以《无极 Primal Chaos》及 2–3 首微型习作为检验场：以琵琶或可替代的世界乐器 / 电子声部，与西方室内乐团构成可排练、可迭代的作曲循环。&lt;/p&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;p class=&quot;micro&quot;&gt;WUJI → TAI CHI → LIANG YI → SI XIANG → BA GUA → 64 HEXAGRAMS → WUJI&lt;/p&gt;
            &lt;p class=&quot;research-note&quot; data-i18n=&quot;researchNote&quot;&gt;界面提供的是作曲决策与试听草图，不把文化象征压缩为固定的“正确音阶”。每次输出都应在乐器、语境与排练中继续校正。&lt;/p&gt;
          &lt;/div&gt;
        &lt;/aside&gt;
      &lt;/section&gt;

      &lt;section class=&quot;workspace&quot; aria-label=&quot;Composition workbench&quot;&gt;
        &lt;aside class=&quot;panel&quot;&gt;
          &lt;div class=&quot;panel-head&quot;&gt;&lt;div&gt;&lt;h3 data-i18n=&quot;controlTitle&quot;&gt;作曲参数&lt;/h3&gt;&lt;p data-i18n=&quot;controlSub&quot;&gt;选择上下卦、主音、动爻与编制&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;eyebrow&quot;&gt;01 / INPUT&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;controls&quot;&gt;
            &lt;div&gt;&lt;label for=&quot;lower&quot; data-i18n=&quot;lowerLabel&quot;&gt;下卦 / 室内乐基础&lt;/label&gt;&lt;select id=&quot;lower&quot;&gt;&lt;/select&gt;&lt;p class=&quot;field-note&quot; id=&quot;lowerNote&quot;&gt;&lt;/p&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label for=&quot;upper&quot; data-i18n=&quot;upperLabel&quot;&gt;上卦 / 独奏声部&lt;/label&gt;&lt;select id=&quot;upper&quot;&gt;&lt;/select&gt;&lt;p class=&quot;field-note&quot; id=&quot;upperNote&quot;&gt;&lt;/p&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label for=&quot;tonic&quot; data-i18n=&quot;tonicLabel&quot;&gt;主音 / Tonic&lt;/label&gt;&lt;select id=&quot;tonic&quot;&gt;&lt;/select&gt;&lt;p class=&quot;field-note&quot; data-i18n=&quot;tonicNote&quot;&gt;相对音列据此移调&lt;/p&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label for=&quot;solo&quot; data-i18n=&quot;soloLabel&quot;&gt;独奏声部&lt;/label&gt;&lt;select id=&quot;solo&quot;&gt;&lt;option value=&quot;pipa&quot;&gt;琵琶 / Pipa&lt;/option&gt;&lt;option value=&quot;guzheng&quot;&gt;古筝 / Guzheng&lt;/option&gt;&lt;option value=&quot;erhu&quot;&gt;二胡 / Erhu&lt;/option&gt;&lt;option value=&quot;guitar&quot;&gt;古典吉他 / Classical guitar&lt;/option&gt;&lt;option value=&quot;electro&quot;&gt;电子声部 / Electroacoustic&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div class=&quot;wide&quot;&gt;&lt;label data-i18n=&quot;motionLabel&quot;&gt;动爻 / Moving line&lt;/label&gt;&lt;div class=&quot;motion-row&quot; id=&quot;motionRow&quot;&gt;&lt;/div&gt;&lt;p class=&quot;field-note&quot; data-i18n=&quot;motionNote&quot;&gt;选择一个动爻。演奏版本只滑动对应声部节点，避免把变卦机械化为全体音高替换。&lt;/p&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label for=&quot;motionSize&quot; data-i18n=&quot;slideLabel&quot;&gt;滑动幅度&lt;/label&gt;&lt;select id=&quot;motionSize&quot;&gt;&lt;option value=&quot;1&quot;&gt;半音 / semitone&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;全音 / whole tone&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label for=&quot;ensemble&quot; data-i18n=&quot;ensembleLabel&quot;&gt;室内乐团&lt;/label&gt;&lt;select id=&quot;ensemble&quot;&gt;&lt;option value=&quot;strings&quot;&gt;弦乐四重奏 / String quartet&lt;/option&gt;&lt;option value=&quot;mixed&quot;&gt;混合室内乐 / Mixed ensemble&lt;/option&gt;&lt;option value=&quot;winds&quot;&gt;木管与打击乐 / Winds &amp;amp; percussion&lt;/option&gt;&lt;option value=&quot;orchestra&quot;&gt;交响乐团 / Symphony orchestra&lt;/option&gt;&lt;option value=&quot;hybrid&quot;&gt;声学与电子结合 / Acoustic + electronics&lt;/option&gt;&lt;option value=&quot;electronics&quot;&gt;电子织体 / Electronics&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div class=&quot;wide action-row&quot;&gt;&lt;button class=&quot;button primary&quot; id=&quot;listenButton&quot; type=&quot;button&quot; data-i18n=&quot;listen&quot;&gt;试听六音列&lt;/button&gt;&lt;button class=&quot;button&quot; id=&quot;midiButton&quot; type=&quot;button&quot; data-i18n=&quot;midi&quot;&gt;导出草图 MIDI&lt;/button&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/aside&gt;

        &lt;div class=&quot;output&quot;&gt;
          &lt;section class=&quot;panel&quot; aria-live=&quot;polite&quot;&gt;

            &lt;article class=&quot;method&quot;&gt;&lt;p class=&quot;index&quot;&gt;RULE 01 / MICRO&lt;/p&gt;&lt;h3 data-i18n=&quot;r1Title&quot;&gt;阴阳到音程与发音&lt;/h3&gt;&lt;p data-i18n=&quot;r1Text&quot;&gt;阳爻倾向全音、纯四 / 五度与连音、保持；阴爻倾向半音、小二度 / 增四度、断奏、泛音、气鸣或拨弦摩擦。&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;method&quot;&gt;&lt;p class=&quot;index&quot;&gt;RULE 02 / MESO&lt;/p&gt;&lt;h3 data-i18n=&quot;r2Title&quot;&gt;八卦到三音列核心&lt;/h3&gt;&lt;p data-i18n=&quot;r2Text&quot;&gt;三爻由下而上对应三音列的时间 / 声部顺序。它是具有文化音响取向的细胞，不是静态和弦标签。&lt;/p&gt;&lt;/article&gt;

        &lt;div class=&quot;matrix-wrap&quot;&gt;&lt;table class=&quot;matrix&quot; aria-label=&quot;64 hexagram compositional matrix&quot;&gt;&lt;thead id=&quot;matrixHead&quot;&gt;&lt;/thead&gt;&lt;tbody id=&quot;matrixBody&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;panel&quot; style=&quot;margin-top:20px&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;文化调式与自由组合 / Cultural modes &amp; free combination&lt;/h3&gt;&lt;p&gt;64 个卦象档案 · 双调式 · 泛调性 · 可导入乐器录音&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;padding:18px;display:grid;gap:12px&quot;&gt;&lt;label&gt;组织方式&lt;select id=&quot;organisation&quot;&gt;&lt;option value=&quot;core&quot;&gt;原始双三音列&lt;/option&gt;&lt;option value=&quot;expanded&quot;&gt;文化参照调式扩展&lt;/option&gt;&lt;option value=&quot;poly&quot;&gt;多调式：上下声部各自调式&lt;/option&gt;&lt;option value=&quot;pan&quot;&gt;泛调性：多中心自由交织&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;上声部移调（半音）&lt;select id=&quot;layerShift&quot;&gt;&lt;option value=&quot;0&quot;&gt;0&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;4&lt;/option&gt;&lt;option value=&quot;5&quot;&gt;5&lt;/option&gt;&lt;option value=&quot;6&quot;&gt;6&lt;/option&gt;&lt;option value=&quot;7&quot;&gt;7&lt;/option&gt;&lt;option value=&quot;8&quot;&gt;8&lt;/option&gt;&lt;option value=&quot;9&quot;&gt;9&lt;/option&gt;&lt;option value=&quot;10&quot;&gt;10&lt;/option&gt;&lt;option value=&quot;11&quot;&gt;11&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;乐器音色&lt;select id=&quot;realInstrument&quot;&gt;&lt;option value=&quot;guzheng&quot;&gt;古筝 · 合成拨弦&lt;/option&gt;&lt;option value=&quot;pipa&quot;&gt;琵琶 · 合成拨弦&lt;/option&gt;&lt;option value=&quot;erhu&quot;&gt;二胡 · 合成拉弦&lt;/option&gt;&lt;option value=&quot;dizi&quot;&gt;笛子 · 合成吹管&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div style=&quot;display:flex;gap:10px&quot;&gt;&lt;button class=&quot;button primary&quot; id=&quot;playStudy&quot;&gt;试听调式研究草图&lt;/button&gt;&lt;button class=&quot;button&quot; id=&quot;stopStudy&quot;&gt;停止&lt;/button&gt;&lt;/div&gt;&lt;label&gt;真实音色：导入本地单音采样&lt;input type=&quot;file&quot; id=&quot;sampleFile&quot; accept=&quot;audio/*&quot;&gt;&lt;/label&gt;&lt;label&gt;采样原音 MIDI（C4 = 60）&lt;input data-sample-root type=&quot;number&quot; min=&quot;0&quot; max=&quot;127&quot; value=&quot;60&quot; style=&quot;padding:8px;width:100%&quot;&gt;&lt;/label&gt;&lt;p id=&quot;sampleStatus&quot; style=&quot;font-size:.75rem;color:#b8cbc5&quot;&gt;默认使用合成模型；上传清晰、无伴奏的单音录音后，按原音移调播放。单个样本大幅移调会改变音色。&lt;/p&gt;&lt;p id=&quot;expandedNotes&quot; style=&quot;color:#f1cf7e&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;scoring&quot;&gt;
        &lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;div&gt;&lt;h3 data-i18n=&quot;scoreTitle&quot;&gt;配器草图&lt;/h3&gt;&lt;p data-i18n=&quot;scoreSub&quot;&gt;把上下卦空间化，而非只把它们叠成和弦&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;eyebrow&quot;&gt;04 / SCORE&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;score-body&quot;&gt;&lt;div class=&quot;score-map&quot; id=&quot;scoreMap&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;aside class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;div&gt;&lt;h3 data-i18n=&quot;protocolTitle&quot;&gt;排练与研究记录&lt;/h3&gt;&lt;p data-i18n=&quot;protocolSub&quot;&gt;把系统输出回到实践中验证&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;eyebrow&quot;&gt;LOG&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;protocol&quot;&gt;&lt;ol&gt;&lt;li data-i18n-html=&quot;p1&quot;&gt;&lt;strong&gt;记录参数：&lt;/strong&gt;保存当前卦、主音、动爻、速度与编制。&lt;/li&gt;&lt;li data-i18n-html=&quot;p2&quot;&gt;&lt;strong&gt;写 30–60 秒草图：&lt;/strong&gt;让下卦维持 / 变形，让上卦成为独奏的时间性材料。&lt;/li&gt;&lt;li data-i18n-html=&quot;p3&quot;&gt;&lt;strong&gt;听辨滑动：&lt;/strong&gt;确认动爻产生的是可感知的横向变化，而非抽象规则展示。&lt;/li&gt;&lt;li data-i18n-html=&quot;p4&quot;&gt;&lt;strong&gt;反思并修订：&lt;/strong&gt;记录文化联想、演奏可行性和音响结果，再回写规则库。&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/aside&gt;
      &lt;/section&gt;
    &lt;/main&gt;
&lt;section class=&quot;panel&quot; style=&quot;margin-top:20px&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;64 卦文化调式档案 / Modal atlas&lt;/h3&gt;&lt;p&gt;以下为本研究的作曲映射提案；文化参照不表示历史上存在固定卦象与音阶对应。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;padding:18px;overflow:auto&quot;&gt;&lt;table class=&quot;matrix&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;卦 / 上下卦&lt;/th&gt;&lt;th&gt;三音列来源&lt;/th&gt;&lt;th&gt;文化参照&lt;/th&gt;&lt;th&gt;扩展音级&lt;/th&gt;&lt;th&gt;规则来源&lt;/th&gt;&lt;th&gt;你的原创映射&lt;/th&gt;&lt;th&gt;重复音与声部&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;atlasRows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div style=&quot;padding:18px;font-size:.8rem;color:#b8cbc5&quot;&gt;阴阳发音：阳为连音 / 保持 / 共振，阴为短音 / 泛音 / 气声。六个爻是六个声部位置，不保证六个不同音级。需卦例使用 [1–2–3–5–6–7]；明夷卦的文本示例与固定三音列表不一致，作为独立人工调式方案 [1–♭2–3–4–5–♭7] 展示。唐宋、拉格、都节等为文化参照，具体历史律制仍需另行考证。&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;research-section&quot; id=&quot;researchSources&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;PROVENANCE · CULTURE · ORIGINAL MAPPING&lt;/p&gt;&lt;h2&gt;来源与原创边界&lt;/h2&gt;&lt;div class=&quot;research-grid&quot;&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;传统结构&lt;/h3&gt;&lt;p&gt;《易经》符号结构提供六爻、上下卦及组合逻辑。基础介绍参考哥伦比亚大学 Asia for Educators；古籍资料可从美国国会图书馆查阅。&lt;/p&gt;&lt;a href=&quot;https://video.afe.easia.columbia.edu/teaching-guides/the-yijing-teaching-guide/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;阅读基础介绍&lt;/a&gt;&lt;br&gt;&lt;a href=&quot;https://www.loc.gov/item/2021666491/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;查阅古籍资料&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;RP1中的研究与先行实践&lt;/h3&gt;&lt;p&gt;RP1讨论约翰·凯奇、周文中、赵晓生、钟耀光等先行研究，并提出象、数、理、占与循环创作的实践方向。下列书目来自RP1，作为研究入口，不表示其作者提出了本站全部音高映射。&lt;/p&gt;&lt;p&gt;Ruizhe Zhang. RP1: &lt;em&gt;Hexagram Resonance: Contemporary Music Composition Practices through the Symbolic System of the I Ching's Sixty-Four Hexagrams.&lt;/em&gt;&lt;/p&gt;&lt;p&gt;Xue, K., &amp;amp; Loo, F. Y. (2019). &lt;em&gt;Transcoding the I Ching as Composition Techniques in Chou Wen Chung, Zhao Xiaosheng and Chung Yiu Kwong.&lt;/em&gt; Musica Hodie, 19.&lt;/p&gt;&lt;p&gt;Zhao, X. (1988). &lt;em&gt;Tai Chi composition system.&lt;/em&gt; Art of Music, (04), 16–25.&lt;/p&gt;&lt;p&gt;Chung, Y. K. (1995). &lt;em&gt;I Ching Compositional System.&lt;/em&gt; City University of New York.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;research-cell&quot;&gt;&lt;h3&gt;作者更新规则与网站实现&lt;/h3&gt;&lt;p&gt;作者提出阴阳音程与技法、八卦三音列、上下卦耦合与动爻滑动。64卦扩展音级、试听算法和文化标签是网站实现提案；同一音级集合可能用于不同卦象。&lt;/p&gt;&lt;p&gt;创作者：张睿哲 Ruizhe Zhang&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;    &lt;footer&gt;&lt;p data-i18n=&quot;footer1&quot;&gt;为《易经》生成逻辑与当代室内乐 / 电子音乐实践而设的研究界面。&lt;/p&gt;&lt;p data-i18n=&quot;footer2&quot;&gt;V1 · composition prototype · no divination claims&lt;/p&gt;&lt;/footer&gt;
  &lt;/div&gt;

es: agree on audio, lyrics, score, revisions, fees and usage rights&quot;],[&quot;，&quot;,&quot;, &quot;],[&quot;琵琶 / Pipa&quot;,&quot;Pipa&quot;],[&quot;古筝 / Guzheng&quot;,&quot;Guzheng&quot;],[&quot;二胡 / Erhu&quot;,&quot;Erhu&quot;],[&quot;古典吉他 / Classical guitar&quot;,&quot;Classical guitar&quot;],[&quot;电子声部 / Electroacoustic&quot;,&quot;Electroacoustic voice&quot;],[&quot;弦乐四重奏 / String quartet&quot;,&quot;String quartet&quot;],[&quot;混合室内乐 / Mixed ensemble&quot;,&quot;Mixed chamber ensemble&quot;],[&quot;木管与打击乐 / Winds &amp; percussion&quot;,&quot;Winds and percussion&quot;],[&quot;电子织体 / Electronics&quot;,&quot;Electronic texture&quot;],[&quot;半音 / semitone&quot;,&quot;Semitone&quot;],[&quot;全音 / whole tone&quot;,&quot;Whole tone&quot;],[&quot;对称五度&quot;,&quot;Symmetric fifth&quot;],[&quot;已配置端点；点击按钮才会发送&quot;,&quot;Endpoint configured; send a request with a button&quot;],[&quot;起卦中 · 正在生成本卦&quot;,&quot;Casting the primary hexagram&quot;],[&quot;阴阳交错 · 定位动爻&quot;,&quot;Yin–Yang transition · locating the moving line&quot;],[&quot;卦象成形 · 转译音乐材料&quot;,&quot;Hexagram formed · translating musical material&quot;],[&quot;易经与研究背景&quot;,&quot;The I Ching and research context&quot;],[&quot;从阴阳符号到当代音乐：张睿哲 Ruizhe Zhang 的实践研究&quot;,&quot;From Yin–Yang symbols to contemporary music: practice research by Ruizhe Zhang&quot;],[&quot;《易经》（Yijing / I Ching，Book of Changes）以变化为核心。阴爻为断线，阳爻为实线；三爻组合构成八卦，上下两个八卦组合构成六十四卦。卦象既提供象征图像，也为讨论情境与转变提供结构。&quot;,&quot;The Yijing (I Ching, Book of Changes) centres on change. A Yin line is broken and a Yang line is solid; three lines form a trigram, and two trigrams form a hexagram. The eight-by-eight combinations produce 64 hexagrams, offering symbolic images and structures for discussing situations and transitions.&quot;],[&quot;在本研究中，传统符号成为创作的起点：阴阳影响音程与发音，八卦形成三音列，上下卦生成音场，动爻驱动横向声部变化。音高、配器和文化调式的对应属于本研究的创作定义，不能直接当作古代《易经》的音乐规定。&quot;,&quot;In this research, traditional symbols initiate composition: Yin–Yang affects intervals and articulation, trigrams form trichords, paired trigrams generate pitch fields, and moving lines drive horizontal voice-leading. Pitch, instrumentation and cultural-modal correspondences are compositional definitions in this research, rather than ancient musical prescriptions from the I Ching.&quot;],[&quot;象：音响形态与文化意象&quot;,&quot;Xiang: sonic form and cultural imagery&quot;],[&quot;数：爻位、组合与参数&quot;,&quot;Shu: line positions, combinations and parameters&quot;],[&quot;理：材料发展与变化逻辑&quot;,&quot;Li: material development and the logic of change&quot;],[&quot;占：材料选择与生成过程&quot;,&quot;Zhan: material selection and generative process&quot;],[&quot;循环叙事与研究方法&quot;,&quot;Cyclic narrative and research method&quot;],[&quot;RP1 将无极、太极、两仪、四象、八卦、六十四卦组织为宏观音乐叙事，并以实践导向的质性研究、作品分析、访谈和创作记录发展系统。网站进一步展示三音列、声部滑动与跨文化调式的更新方案。早期作品与当前规则属于不同迭代阶段。&quot;,&quot;RP1 organises Wuji, Taiji, Liangyi, Sixiang, Bagua and the 64 hexagrams as a macro musical narrative. Practice-led qualitative inquiry, case analysis, interviews and creative documentation develop the system. This website presents later proposals for trichords, voice-leading slides and cross-cultural modes. The early work and the current rules belong to different stages of development.&quot;],[&quot;作品案例&quot;,&quot;Composition case study&quot;],[&quot;太初 Primordial · 琵琶与弦乐四重奏 · 2024&quot;,&quot;Primordial 太初 · pipa and string quartet · 2024&quot;],[&quot;作曲：张睿哲 Ruizhe Zhang · 乐谱27页 · 标注时长6分7秒&quot;,&quot;Composer: Ruizhe Zhang 张睿哲 · 27-page score · stated duration 6 minutes 7 seconds&quot;],[&quot;根据乐谱中的作品说明，《太初》通过琵琶与弦乐的碰撞、流动的五声与七声旋律，以及动静对照表现本原意象。其叙事从混沌开端，经由中段爆发，回到平静的原始状态。&quot;,&quot;According to the programme note in the score, Primordial explores an image of origins through collisions between pipa and strings, flowing pentatonic and heptatonic melodies, and contrasts of motion and stillness. Its narrative moves from initial chaos through an explosive central phase to a tranquil primal state.&quot;],[&quot;与当前规则的关系：这是研究早期实践的参考案例，可用于观察音色对话、泛调性和循环叙事。现有材料没有证明作品逐一使用了当前64卦三音列规则，因此不将它描述为该规则的完整验证。&quot;,&quot;Relation to the current rules: this is a reference case from earlier practice, useful for observing timbral dialogue, pantonality and cyclic narrative. The supplied materials do not establish that the piece applies every current 64-hexagram trichord rule, so it is not presented as a complete validation of that system.&quot;],[&quot;播放你提供的音频&quot;,&quot;Play the supplied audio&quot;],[&quot;音频由作者提供；录音演奏者与制作方式未在本页另行署名。&quot;,&quot;Audio supplied by the composer; performers and production method are not separately credited on this page.&quot;],[&quot;打开完整乐谱&quot;,&quot;Open complete score&quot;],[&quot;下载音频&quot;,&quot;Download audio&quot;],[&quot;阅读作品说明（PDF第2页）&quot;,&quot;Read programme note (PDF page 2)&quot;],[&quot;演奏技法说明（PDF第3–4页）&quot;,&quot;Performance notation (PDF pages 3–4)&quot;],[&quot;混沌开端&quot;,&quot;Initial chaos&quot;],[&quot;乐谱开端标示 Largo、♩=48、rubato 与 veiled；可结合谱面观察零散事件、休止与拨弦／拉弦转换。&quot;,&quot;The opening is marked Largo, quarter note = 48, rubato and veiled. The score invites examination of scattered events, rests and transitions between plucked and bowed textures.&quot;],[&quot;音色碰撞与发展&quot;,&quot;Timbral collision and development&quot;],[&quot;技法说明包含琵琶的拍、提、摘、弹面板、轮与长轮，以及弦乐左手拨弦。它们为音响与手势研究提供具体材料。&quot;,&quot;The performance notes describe pipa techniques including pai, lifting and releasing a string, zhai, soundboard strikes, lun and extended lun, alongside left-hand pizzicato for strings. They provide concrete material for sonic and gestural investigation.&quot;],[&quot;循环与回归&quot;,&quot;Cycle and return&quot;],[&quot;回归平静的叙事来自作者的作品说明；完整过程可通过音频和全谱共同观察。本页未标注未经核对的段落时间。&quot;,&quot;The return to tranquillity is described in the composer’s programme note. Explore the full process through the audio and complete score; unverified section timestamps are not supplied.&quot;],[&quot;开端谱面预览（PDF第5页）&quot;,&quot;Opening score preview (PDF page 5)&quot;],[&quot;原始乐谱保留原有标记；预览只是阅读辅助。&quot;,&quot;The supplied score retains its original markings; the preview is a reading aid.&quot;],[&quot;规则来源&quot;,&quot;Rule provenance&quot;],[&quot;你的原创映射&quot;,&quot;Original compositional mapping&quot;],[&quot;结构依据：阴阳六爻、上下三爻、8×8组合。创作依据：RP1研究方向与作者更新的规则1–3。&quot;,&quot;Structural basis: six Yin–Yang lines, upper and lower trigrams, and 8×8 combinations. Compositional basis: the research direction in RP1 and the composer’s revised Rules 1–3.&quot;],[&quot;文化参照是创作取向；不是经过文献验证的古代卦象调式表。&quot;,&quot;Cultural references describe creative directions, not a historically verified table of hexagram modes.&quot;],[&quot;下卦→室内乐基础；上卦→独奏前景；六爻→六个声部位置；动爻→单音滑动。扩展音级由本站算法提出，待作品与排练验证。&quot;,&quot;Lower trigram → chamber ground; upper trigram → solo foreground; six lines → six voice positions; moving line → a single-note slide. Extended pitch classes are proposed by this site’s algorithm and await compositional and rehearsal validation.&quot;],[&quot;来源与原创边界&quot;,&quot;Sources and boundaries of originality&quot;],[&quot;传统结构&quot;,&quot;Traditional structure&quot;],[&quot;RP1中的研究与先行实践&quot;,&quot;Research and prior practice in RP1&quot;],[&quot;作者更新规则与网站实现&quot;,&quot;Revised author rules and website implementation&quot;],[&quot;《易经》符号结构提供六爻、上下卦及组合逻辑。基础介绍参考哥伦比亚大学 Asia for Educators；古籍资料可从美国国会图书馆查阅。&quot;,&quot;The I Ching supplies the six-line structure, upper and lower trigrams, and combinatorial logic. The introductory context refers to Columbia University’s Asia for Educators; historical editions can be consulted through the Library of Congress.&quot;],[&quot;RP1讨论约翰·凯奇、周文中、赵晓生、钟耀光等先行研究，并提出象、数、理、占与循环创作的实践方向。下列书目来自RP1，作为研究入口，不表示其作者提出了本站全部音高映射。&quot;,&quot;RP1 discusses prior work by John Cage, Chou Wen-chung, Zhao Xiaosheng and Chung Yiu-kwong, and proposes practice connecting Xiang, Shu, Li and Zhan with cyclic composition. The references below are taken from RP1 as research entry points, not as authorship claims for all pitch mappings on this site.&quot;],[&quot;作者提出阴阳音程与技法、八卦三音列、上下卦耦合与动爻滑动。64卦扩展音级、试听算法和文化标签是网站实现提案；同一音级集合可能用于不同卦象。&quot;,&quot;The composer proposes Yin–Yang intervals and techniques, trigram trichords, trigram coupling and moving-line slides. The 64-hexagram extended pitch classes, audition algorithms and cultural labels are website implementation proposals; different hexagrams may share the same pitch-class set.&quot;],[&quot;阅读基础介绍&quot;,&quot;Read the introductory guide&quot;],[&quot;查阅古籍资料&quot;,&quot;Consult the historical edition&quot;],[&quot;创作者：张睿哲 Ruizhe Zhang&quot;,&quot;Creator: Ruizhe Zhang 张睿哲&quot;],[&quot;七阶段生成与回归循环&quot;,&quot;Seven-stage cycle of generation and return&quot;],[&quot;单首作品与整个作品集均可使用；适用于声学、电子与混合媒介。&quot;,&quot;Applicable to a single work or an entire portfolio, using acoustic, electronic or mixed media.&quot;],[&quot;六个演化阶段，加上第七个“归无极”闭环位置。六十四卦是第六阶段，不能替代整个七阶段体系。&quot;,&quot;Six evolutionary stages plus a seventh position, Return to Wuji. The 64 hexagrams form stage six within the full seven-stage system.&quot;],[&quot;单首作品的曲式结构&quot;,&quot;Formal structure within a single work&quot;],[&quot;在同一首作品中，将七阶段作为段落、乐章或贯穿发展的结构功能。各阶段时长由音乐需要决定；不要求平均分配。&quot;,&quot;Within one work, use the seven stages as sections, movements or continuously developing structural functions. Their durations follow musical needs and need not be equal.&quot;],[&quot;作品集的大循环&quot;,&quot;Macro cycle across a portfolio&quot;],[&quot;让不同作品或组曲承担不同阶段，连成无极到归无极的大循环。《太初》作为无极阶段的开端与锚定案例；其他阶段可由后续作品展开。&quot;,&quot;Assign stages to different pieces or suites within a macro cycle from Wuji to Return to Wuji. Primordial anchors the opening Wuji stage; subsequent works may develop the other stages.&quot;],[&quot;媒介与编制开放&quot;,&quot;Open instrumentation and media&quot;],[&quot;室内乐、交响乐、纯电子音乐、声学乐器与电子音乐结合，以及世界乐器参与的混合形式均可承载本体系。具体编制依作品构思与资源决定。&quot;,&quot;The system can support chamber music, symphonic music, purely electronic music, acoustic instruments with electronics, and mixed forms involving world instruments. Choose forces according to the work and available resources.&quot;],[&quot;哲学与音响&quot;,&quot;Concept and sonic character&quot;],[&quot;作曲规则&quot;,&quot;Compositional rules&quot;],[&quot;来源：research aims 汇报中的生成循环、锚定作品与编制灵活性；研究PPT第10–14页的阶段技法、第16–19页的作品与交响／电子方案；以及作者本次明确的七阶段应用方式。&quot;,&quot;Sources: the generative cycle, anchor work and instrumentation flexibility in research aims; stage techniques on slides 10–14 and portfolio, symphonic and electronic proposals on slides 16–19 of the research presentation; and the composer’s current clarification of the seven-stage application.&quot;],[&quot;《太初》：无极阶段的作品案例&quot;,&quot;Primordial: a case study of the Wuji stage&quot;],[&quot;阶段定位：无极。作品表现混乱的开始，以琵琶与弦乐四重奏探索未分化音响、扩展技法与本原意象。该作品的内部发展属于无极阶段的音响实践；它不按六十四卦逐一对应，也不承担整个七阶段循环。&quot;,&quot;Stage placement: Wuji. The work embodies a chaotic beginning, exploring undifferentiated sound, extended techniques and primordial imagery through pipa and string quartet. Its internal development belongs to Wuji-stage practice; it neither maps the 64 hexagrams individually nor represents the complete seven-stage cycle.&quot;],[&quot;研究定位：七阶段体系适用于单首作品或作品集，编制开放。琵琶与弦乐四重奏是《太初》的具体编制，不是体系对所有作品的限制。&quot;,&quot;Research scope: the seven-stage system applies to a single work or a portfolio with open instrumentation. Pipa and string quartet are the specific forces for Primordial, rather than a restriction on the whole system.&quot;],[&quot;交响乐团 / Symphony orchestra&quot;,&quot;Symphony orchestra&quot;],[&quot;声学与电子结合 / Acoustic + electronics&quot;,&quot;Acoustic instruments with electronics&quot;],[&quot;无极 Wuji&quot;,&quot;Wuji / Non-polarity&quot;],[&quot;混沌未分、无形与不确定音响。&quot;,&quot;Undifferentiated chaos, formlessness and indeterminate sound.&quot;],[&quot;自由或无节拍节奏；噪音织体、环境音、非固定音高；刮奏、特殊拨弦、气鸣与敲击；非线性、弥散开篇。《太初》对应本阶段。&quot;,&quot;Free or unmetered rhythm; noise, environmental and unpitched textures; scraping, unusual plucking, air sounds and impacts; a diffuse nonlinear opening. Primordial belongs to this stage.&quot;],[&quot;太极 Taiji&quot;,&quot;Taiji / Supreme polarity&quot;],[&quot;从混沌中建立可感知的阴阳二元与极化张力。&quot;,&quot;Establish perceptible Yin–Yang duality and polarised tension within chaos.&quot;],[&quot;三全音轴（如 C 与 F♯）、三全音与纯五度对置、半音与全音音场对置；持续共振与碎片点描形成两个张力场。&quot;,&quot;A tritone axis such as C and F-sharp; tritone versus perfect fifth, chromatic versus whole-tone fields; sustained resonance opposed to fragmented pointillism.&quot;],[&quot;两仪 Liangyi&quot;,&quot;Liangyi / Two modes&quot;],[&quot;对立元素交织、对话、追逐与相互渗透。&quot;,&quot;Opposing elements intertwine, converse, pursue and permeate each other.&quot;],[&quot;阳的连续旋律与阴的断奏点描交互；对话、模仿与对位；规则律动和不规则节奏叠置；冲突和声逐步融合。&quot;,&quot;Continuous Yang melody interacts with detached Yin gestures; dialogue, imitation and counterpoint; regular pulse layered with irregular rhythms; gradual integration of conflicting harmonies.&quot;],[&quot;四象 Sixiang&quot;,&quot;Sixiang / Four symbols&quot;],[&quot;四季意象与四种独立音乐性格。&quot;,&quot;Seasonal imagery and four distinct musical characters.&quot;],[&quot;四种调式或音色组：中国五声、印度拉格、中古调式、人工音阶等文化参照；四度叠置、速度与情绪对照；可顺次铺陈或平行叠加。&quot;,&quot;Four modal or timbral groups referencing Chinese pentatonic material, Indian raga, medieval modes or synthetic scales; quartal structures and contrasting tempi and moods; sequential presentation or parallel layering.&quot;],[&quot;八卦 Bagua&quot;,&quot;Bagua / Eight trigrams&quot;],[&quot;八种文化编码的音乐语汇与三音列核心。&quot;,&quot;Eight culturally coded musical vocabularies and trichord nuclei.&quot;],[&quot;按更新规则构建八组三音列：乾 [1–2–3]、坤半音簇、震 [5–1–♭2]、巽 [3–4–6]、坎 [5–6–7]、离 [1–♭3–3]、艮 [2–♭3–5]、兑 [6–1–2]；同时定义节奏、技法与文化取向。&quot;,&quot;Use the revised eight trichords: Qian [1–2–3], Kun chromatic cluster, Zhen [5–1–♭2], Xun [3–4–6], Kan [5–6–7], Li [1–♭3–3], Gen [2–♭3–5], Dui [6–1–2]; define rhythmic, technical and cultural tendencies.&quot;],[&quot;六十四卦 64 Hexagrams&quot;,&quot;64 Hexagrams&quot;],[&quot;双三音列复合、多调式与最大化复调。&quot;,&quot;Paired-trichord synthesis, polymodality and maximal polyphony.&quot;],[&quot;上下卦复合为音场，扩展跨文化人工调式；多调性、泛调性、复合节奏及频谱密度叠加；动爻以单音滑动连接调式，形成循环发展的复杂顶点。&quot;,&quot;Couple upper and lower trigrams into pitch fields and cross-cultural synthetic modes; layer polytonality, pantonality, polyrhythm and spectral density; use moving-line slides to connect modes at the cycle’s complex culmination.&quot;],[&quot;归无极 Return to Wuji&quot;,&quot;Return to Wuji / Cyclic closure&quot;],[&quot;从复杂性消解回混沌、噪音或静默。&quot;,&quot;Dissolve complexity into chaos, noise or silence.&quot;],[&quot;逐渐消退与简化、音高模糊、节奏消散、音色解体；呼应开篇，完成单曲或作品集的循环闭合。归无极是第七个结构位置，与初始无极相呼应。&quot;,&quot;Progressive fading and simplification, pitch blurring, rhythmic dispersal and timbral dissolution; recall the opening to close a work or portfolio cycle. The return is the seventh structural position, echoing the initial Wuji.&quot;]].sort((a,b)=&gt;b[0].length-a[0].length),translationCache=new WeakMap();

      &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;seal&quot; aria-hidden=&quot;true&quot;&gt;☯&lt;/div&gt;&lt;div&gt;&lt;h1 data-t=&quot;brand&quot;&gt;命格作曲&lt;/h1&gt;&lt;p data-t=&quot;tagline&quot;&gt;FORTUNE-TELLING COMPOSITION&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;header-actions&quot;&gt;&lt;a class=&quot;small-btn&quot; href=&quot;#modalLab&quot; data-t=&quot;labLink&quot;&gt;调式与 AI 工作台&lt;/a&gt;&lt;button class=&quot;small-btn&quot; id=&quot;langBtn&quot; type=&quot;button&quot;&gt;EN&lt;/button&gt;&lt;/div&gt;

    &lt;div id=&quot;castOverlay&quot; class=&quot;cast-overlay&quot; hidden role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;div&gt;&lt;div class=&quot;cast-orbit&quot;&gt;☯&lt;/div&gt;&lt;div class=&quot;casting-bars&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;p id=&quot;castProgress&quot;&gt;起卦中 · 正在生成本卦与动爻&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;main&gt;
      &lt;section class=&quot;hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot; data-t=&quot;eyebrow&quot;&gt;symbolic prompt engine · practice-led research&lt;/p&gt;&lt;h2 data-thtml=&quot;hero&quot;&gt;让&lt;span&gt;命格&lt;/span&gt;成为一段&lt;br&gt;可聆听、可排练的&lt;span&gt;作曲叙事&lt;/span&gt;。&lt;/h2&gt;&lt;p data-t=&quot;heroText&quot;&gt;“命格作曲”将起卦的仪式性转化为研究中的材料选择：主卦给出此刻的创作情境，动爻标出一个横向声部滑动节点，变卦提示下一个可写作与反思的方向。&lt;/p&gt;&lt;div class=&quot;hero-tags&quot;&gt;&lt;span class=&quot;chip&quot; data-t=&quot;chip1&quot;&gt;本卦：创作情境&lt;/span&gt;&lt;span class=&quot;chip&quot; data-t=&quot;chip2&quot;&gt;动爻：声部滑动&lt;/span&gt;&lt;span class=&quot;chip&quot; data-t=&quot;chip3&quot;&gt;变卦：下一步实验&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;wheel-card&quot;&gt;&lt;div class=&quot;wheel&quot;&gt;&lt;span&gt;☯&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&lt;b data-t=&quot;wheelTitle&quot;&gt;从问句到谱面。&lt;/b&gt; &lt;span data-t=&quot;wheelText&quot;&gt;同一组输入会产生同一组研究参数，便于在作品集、排练日志与后续版本之间追踪。&lt;/span&gt;&lt;/p&gt;&lt;/aside&gt;&lt;/section&gt;

utton&quot;&gt;生成委托需求单 / Create brief&lt;/button&gt;&lt;button id=&quot;copyBrief&quot; class=&quot;button&quot; type=&quot;button&quot;&gt;复制需求单 / Copy&lt;/button&gt;&lt;button id=&quot;openContact&quot; class=&quot;button&quot; type=&quot;button&quot;&gt;打开专业人士联系页 / Contact&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;service-output&quot; id=&quot;serviceBrief&quot;&gt;需求单会结合当前卦象与音乐参数。你可以先审阅，再自行发送给专业人士。&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;method&quot;&gt;&lt;article class=&quot;method-card&quot;&gt;&lt;p class=&quot;idx&quot;&gt;01 / XIANG 象&lt;/p&gt;&lt;h3 data-t=&quot;m1t&quot;&gt;主卦是创作情境&lt;/h3&gt;&lt;p data-t=&quot;m1p&quot;&gt;上卦描绘独奏 / 前景声部的能量，下卦提供室内乐或电子织体的基础。它们不是命定答案，而是当轮素材的视角。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;method-card&quot;&gt;&lt;p class=&quot;idx&quot;&gt;02 / SHU 数&lt;/p&gt;&lt;h3 data-t=&quot;m2t&quot;&gt;三音列耦合为六音列&lt;/h3&gt;&lt;p data-t=&quot;m2p&quot;&gt;八卦由底向上的三爻对应三音列。上、下卦并置形成六个声部位置，成为跨文化调式与织体的可操作核心。&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;method-card&quot;&gt;&lt;p class=&quot;idx&quot;&gt;03 / LI 理 &amp;amp; ZHAN 占&lt;/p&gt;&lt;h3 data-t=&quot;m3t&quot;&gt;动爻变成行动节点&lt;/h3&gt;&lt;p data-t=&quot;m3p&quot;&gt;动爻让一个音以半音或全音滑动，产生变卦。研究价值不在“准不准”，而在是否促成可听、可排练、可反思的变化。&lt;/p&gt;&lt;/article&gt;&lt;/section&gt;

m and fortune reading&quot;],[&quot;古筝合成&quot;,&quot;Guzheng synthesis&quot;],[&quot;琵琶合成&quot;,&quot;Pipa synthesis&quot;],[&quot;二胡合成&quot;,&quot;Erhu synthesis&quot;],[&quot;笛子合成&quot;,&quot;Dizi synthesis&quot;],[&quot;仅本地提示词，不联网&quot;,&quot;Local prompts only · offline&quot;],[&quot;Suno REST 代理&quot;,&quot;Suno REST proxy&quot;],[&quot;OpenAI 兼容文本代理&quot;,&quot;OpenAI-compatible text proxy&quot;],[&quot;自定义 JSON 端点&quot;,&quot;Custom JSON endpoint&quot;],[&quot;需求单已复制&quot;,&quot;Commission brief copied&quot;],[&quot;请填写专业人士的 HTTPS 公开联系页&quot;,&quot;Enter the practitioner’s public HTTPS contact URL&quot;],[&quot;请输入 HTTPS 端点，或本机 localhost 地址。&quot;,&quot;Enter an HTTPS endpoint or a local localhost address.&quot;],[&quot;下 / 上&quot;,&quot;Lower / upper&quot;],[&quot;名字或创作署名&quot;,&quot;Name or creative signature&quot;],[&quot;本站自定义姓名与日期种子算法；并非传统八字排盘。&quot;,&quot;Uses this site’s custom name-and-date seed algorithm; it is not traditional Ba Zi charting.&quot;],[&quot;起卦与作曲计算在本地完成。AI 请求只发送卦象与音乐参数，不发送姓名、生辰和私人问句。&quot;,&quot;Casting and musical calculations run locally. AI requests include hexagrams and musical parameters. Names and birth details are excluded; a personal question is sent only if you select that option.&quot;],[&quot;阴 → 阳&quot;,&quot;Yin → Yang&quot;],[&quot;阳 → 阴&quot;,&quot;Yang → Yin&quot;],[&quot;命格作曲委托 / Fortune-telling Composition Commission&quot;,&quot;Fortune-telling Composition Commission&quot;],[&quot;服务：&quot;,&quot;Service: &quot;],[&quot;作品：&quot;,&quot;Format: &quot;],[&quot;预算与时间：&quot;,&quot;Budget and deadline: &quot;],[&quot;主卦：&quot;,&quot;Primary hexagram: &quot;],[&quot;变卦：&quot;,&quot;Changed hexagram: &quot;],[&quot;音乐音高：&quot;,&quot;Pitch material: &quot;],[&quot;动爻：&quot;,&quot;Moving line: &quot;],[&quot;音乐需求：&quot;,&quot;Musical requirements: &quot;],[&quot;专业解读：由委托人和专业人士另行确认后填写&quot;,&quot;Professional reading: to be agreed by the client and practitioner&quot;],[&quot;交付范围：双方确认音频、歌词、乐谱、修改次数、费用及使用权&quot;,&quot;Deliverables: agree on audio, lyrics, score, revisions, fees and usage rights&quot;],[&quot;，&quot;,&quot;, &quot;],[&quot;琵琶 / Pipa&quot;,&quot;Pipa&quot;],[&quot;古筝 / Guzheng&quot;,&quot;Guzheng&quot;],[&quot;二胡 / Erhu&quot;,&quot;Erhu&quot;],[&quot;古典吉他 / Classical guitar&quot;,&quot;Classical guitar&quot;],[&quot;电子声部 / Electroacoustic&quot;,&quot;Electroacoustic voice&quot;],[&quot;弦乐四重奏 / String quartet&quot;,&quot;String quartet&quot;],[&quot;混合室内乐 / Mixed ensemble&quot;,&quot;Mixed chamber ensemble&quot;],[&quot;木管与打击乐 / Winds &amp; percussion&quot;,&quot;Winds and percussion&quot;],[&quot;电子织体 / Electronics&quot;,&quot;Electronic texture&quot;],[&quot;半音 / semitone&quot;,&quot;Semitone&quot;],[&quot;全音 / whole tone&quot;,&quot;Whole tone&quot;],[&quot;对称五度&quot;,&quot;Symmetric fifth&quot;],[&quot;已配置端点；点击按钮才会发送&quot;,&quot;Endpoint configured; send a request with a button&quot;],[&quot;起卦中 · 正在生成本卦&quot;,&quot;Casting the primary hexagram&quot;],[&quot;阴阳交错 · 定位动爻&quot;,&quot;Yin–Yang transition · locating the moving line&quot;],[&quot;卦象成形 · 转译音乐材料&quot;,&quot;Hexagram formed · translating musical material&quot;],[&quot;易经与研究背景&quot;,&quot;The I Ching and research context&quot;],[&quot;从阴阳符号到当代音乐：张睿哲 Ruizhe Zhang 的实践研究&quot;,&quot;From Yin–Yang symbols to contemporary music: practice research by Ruizhe Zhang&quot;],[&quot;《易经》（Yijing / I Ching，Book of Changes）以变化为核心。阴爻为断线，阳爻为实线；三爻组合构成八卦，上下两个八卦组合构成六十四卦。卦象既提供象征图像，也为讨论情境与转变提供结构。&quot;,&quot;The Yijing (I Ching, Book of Changes) centres on change. A Yin line is broken and a Yang line is solid; three lines form a trigram, and two trigrams form a hexagram. The eight-by-eight combinations produce 64 hexagrams, offering symbolic images and structures for discussing situations and transitions.&quot;],[&quot;在本研究中，传统符号成为创作的起点：阴阳影响音程与发音，八卦形成三音列，上下卦生成音场，动爻驱动横向声部变化。音高、配器和文化调式的对应属于本研究的创作定义，不能直接当作古代《易经》的音乐规定。&quot;,&quot;In this research, traditional symbols initiate composition: Yin–Yang affects intervals and articulation, trigrams form trichords, paired trigrams generate pitch fields, and moving lines drive horizontal voice-leading. Pitch, instrumentation and cultural-modal correspondences are compositional definitions in this research, rather than ancient musical prescriptions from the I Ching.&quot;],[&quot;象：音响形态与文化意象&quot;,&quot;Xiang: sonic form and cultural imagery&quot;],[&quot;数：爻位、组合与参数&quot;,&quot;Shu: line positions, combinations and parameters&quot;],[&quot;理：材料发展与变化逻辑&quot;,&quot;Li: material development and the logic of change&quot;],[&quot;占：材料选择与生成过程&quot;,&quot;Zhan: material selection and generative process&quot;],[&quot;循环叙事与研究方法&quot;,&quot;Cyclic narrative and research method&quot;],[&quot;RP1 将无极、太极、两仪、四象、八卦、六十四卦组织为宏观音乐叙事，并以实践导向的质性研究、作品分析、访谈和创作记录发展系统。网站进一步展示三音列、声部滑动与跨文化调式的更新方案。早期作品与当前规则属于不同迭代阶段。&quot;,&quot;RP1 organises Wuji, Taiji, Liangyi, Sixiang, Bagua and the 64 hexagrams as a macro musical narrative. Practice-led qualitative inquiry, case analysis, interviews and creative documentation develop the system. This website presents later proposals for trichords, voice-leading slides and cross-cultural modes. The early work and the current rules belong to different stages of development.&quot;],[&quot;作品案例&quot;,&quot;Composition case study&quot;],[&quot;太初 Primordial · 琵琶与弦乐四重奏 · 2024&quot;,&quot;Primordial 太初 · pipa and string quartet · 2024&quot;],[&quot;作曲：张睿哲 Ruizhe Zhang · 乐谱27页 · 标注时长6分7秒&quot;,&quot;Composer: Ruizhe Zhang 张睿哲 · 27-page score · stated duration 6 minutes 7 seconds&quot;],[&quot;根据乐谱中的作品说明，《太初》通过琵琶与弦乐的碰撞、流动的五声与七声旋律，以及动静对照表现本原意象。其叙事从混沌开端，经由中段爆发，回到平静的原始状态。&quot;,&quot;According to the programme note in the score, Primordial explores an image of origins through collisions between pipa and strings, flowing pentatonic and heptatonic melodies, and contrasts of motion and stillness. Its narrative moves from initial chaos through an explosive central phase to a tranquil primal state.&quot;],[&quot;与当前规则的关系：这是研究早期实践的参考案例，可用于观察音色对话、泛调性和循环叙事。现有材料没有证明作品逐一使用了当前64卦三音列规则，因此不将它描述为该规则的完整验证。&quot;,&quot;Relation to the current rules: this is a reference case from earlier practice, useful for observing timbral dialogue, pantonality and cyclic narrative. The supplied materials do not establish that the piece applies every current 64-hexagram trichord rule, so it is not presented as a complete validation of that system.&quot;],[&quot;播放你提供的音频&quot;,&quot;Play the supplied audio&quot;],[&quot;音频由作者提供；录音演奏者与制作方式未在本页另行署名。&quot;,&quot;Audio supplied by the composer; performers and production method are not separately credited on this page.&quot;],[&quot;打开完整乐谱&quot;,&quot;Open complete score&quot;],[&quot;下载音频&quot;,&quot;Download audio&quot;],[&quot;阅读作品说明（PDF第2页）&quot;,&quot;Read programme note (PDF page 2)&quot;],[&quot;演奏技法说明（PDF第3–4页）&quot;,&quot;Performance notation (PDF pages 3–4)&quot;],[&quot;混沌开端&quot;,&quot;Initial chaos&quot;],[&quot;乐谱开端标示 Largo、♩=48、rubato 与 veiled；可结合谱面观察零散事件、休止与拨弦／拉弦转换。&quot;,&quot;The opening is marked Largo, quarter note = 48, rubato and veiled. The score invites examination of scattered events, rests and transitions between plucked and bowed textures.&quot;],[&quot;音色碰撞与发展&quot;,&quot;Timbral collision and development&quot;],[&quot;技法说明包含琵琶的拍、提、摘、弹面板、轮与长轮，以及弦乐左手拨弦。它们为音响与手势研究提供具体材料。&quot;,&quot;The performance notes describe pipa techniques including pai, lifting and releasing a string, zhai, soundboard strikes, lun and extended lun, alongside left-hand pizzicato for strings. They provide concrete material for sonic and gestural investigation.&quot;],[&quot;循环与回归&quot;,&quot;Cycle and return&quot;],[&quot;回归平静的叙事来自作者的作品说明；完整过程可通过音频和全谱共同观察。本页未标注未经核对的段落时间。&quot;,&quot;The return to tranquillity is described in the composer’s programme note. Explore the full process through the audio and complete score; unverified section timestamps are not supplied.&quot;],[&quot;开端谱面预览（PDF第5页）&quot;,&quot;Opening score preview (PDF page 5)&quot;],[&quot;原始乐谱保留原有标记；预览只是阅读辅助。&quot;,&quot;The supplied score retains its original markings; the preview is a reading aid.&quot;],[&quot;规则来源&quot;,&quot;Rule provenance&quot;],[&quot;你的原创映射&quot;,&quot;Original compositional mapping&quot;],[&quot;结构依据：阴阳六爻、上下三爻、8×8组合。创作依据：RP1研究方向与作者更新的规则1–3。&quot;,&quot;Structural basis: six Yin–Yang lines, upper and lower trigrams, and 8×8 combinations. Compositional basis: the research direction in RP1 and the composer’s revised Rules 1–3.&quot;],[&quot;文化参照是创作取向；不是经过文献验证的古代卦象调式表。&quot;,&quot;Cultural references describe creative directions, not a historically verified table of hexagram modes.&quot;],[&quot;下卦→室内乐基础；上卦→独奏前景；六爻→六个声部位置；动爻→单音滑动。扩展音级由本站算法提出，待作品与排练验证。&quot;,&quot;Lower trigram → chamber ground; upper trigram → solo foreground; six lines → six voice positions; moving line → a single-note slide. Extended pitch classes are proposed by this site’s algorithm and await compositional and rehearsal validation.&quot;],[&quot;来源与原创边界&quot;,&quot;Sources and boundaries of originality&quot;],[&quot;传统结构&quot;,&quot;Traditional structure&quot;],[&quot;RP1中的研究与先行实践&quot;,&quot;Research and prior practice in RP1&quot;],[&quot;作者更新规则与网站实现&quot;,&quot;Revised author rules and website implementation&quot;],[&quot;《易经》符号结构提供六爻、上下卦及组合逻辑。基础介绍参考哥伦比亚大学 Asia for Educators；古籍资料可从美国国会图书馆查阅。&quot;,&quot;The I Ching supplies the six-line structure, upper and lower trigrams, and combinatorial logic. The introductory context refers to Columbia University’s Asia for Educators; historical editions can be consulted through the Library of Congress.&quot;],[&quot;RP1讨论约翰·凯奇、周文中、赵晓生、钟耀光等先行研究，并提出象、数、理、占与循环创作的实践方向。下列书目来自RP1，作为研究入口，不表示其作者提出了本站全部音高映射。&quot;,&quot;RP1 discusses prior work by John Cage, Chou Wen-chung, Zhao Xiaosheng and Chung Yiu-kwong, and proposes practice connecting Xiang, Shu, Li and Zhan with cyclic composition. The references below are taken from RP1 as research entry points, not as authorship claims for all pitch mappings on this site.&quot;],[&quot;作者提出阴阳音程与技法、八卦三音列、上下卦耦合与动爻滑动。64卦扩展音级、试听算法和文化标签是网站实现提案；同一音级集合可能用于不同卦象。&quot;,&quot;The composer proposes Yin–Yang intervals and techniques, trigram trichords, trigram coupling and moving-line slides. The 64-hexagram extended pitch classes, audition algorithms and cultural labels are website implementation proposals; different hexagrams may share the same pitch-class set.&quot;],[&quot;阅读基础介绍&quot;,&quot;Read the introductory guide&quot;],[&quot;查阅古籍资料&quot;,&quot;Consult the historical edition&quot;],[&quot;创作者：张睿哲 Ruizhe Zhang&quot;,&quot;Creator: Ruizhe Zhang 张睿哲&quot;],[&quot;七阶段生成与回归循环&quot;,&quot;Seven-stage cycle of generation and return&quot;],[&quot;单首作品与整个作品集均可使用；适用于声学、电子与混合媒介。&quot;,&quot;Applicable to a single work or an entire portfolio, using acoustic, electronic or mixed media.&quot;],[&quot;六个演化阶段，加上第七个“归无极”闭环位置。六十四卦是第六阶段，不能替代整个七阶段体系。&quot;,&quot;Six evolutionary stages plus a seventh position, Return to Wuji. The 64 hexagrams form stage six within the full seven-stage system.&quot;],[&quot;单首作品的曲式结构&quot;,&quot;Formal structure within a single work&quot;],[&quot;在同一首作品中，将七阶段作为段落、乐章或贯穿发展的结构功能。各阶段时长由音乐需要决定；不要求平均分配。&quot;,&quot;Within one work, use the seven stages as sections, movements or continuously developing structural functions. Their durations follow musical needs and need not be equal.&quot;],[&quot;作品集的大循环&quot;,&quot;Macro cycle across a portfolio&quot;],[&quot;让不同作品或组曲承担不同阶段，连成无极到归无极的大循环。《太初》作为无极阶段的开端与锚定案例；其他阶段可由后续作品展开。&quot;,&quot;Assign stages to different pieces or suites within a macro cycle from Wuji to Return to Wuji. Primordial anchors the opening Wuji stage; subsequent works may develop the other stages.&quot;],[&quot;媒介与编制开放&quot;,&quot;Open instrumentation and media&quot;],[&quot;室内乐、交响乐、纯电子音乐、声学乐器与电子音乐结合，以及世界乐器参与的混合形式均可承载本体系。具体编制依作品构思与资源决定。&quot;,&quot;The system can support chamber music, symphonic music, purely electronic music, acoustic instruments with electronics, and mixed forms involving world instruments. Choose forces according to the work and available resources.&quot;],[&quot;哲学与音响&quot;,&quot;Concept and sonic character&quot;],[&quot;作曲规则&quot;,&quot;Compositional rules&quot;],[&quot;来源：research aims 汇报中的生成循环、锚定作品与编制灵活性；研究PPT第10–14页的阶段技法、第16–19页的作品与交响／电子方案；以及作者本次明确的七阶段应用方式。&quot;,&quot;Sources: the generative cycle, anchor work and instrumentation flexibility in research aims; stage techniques on slides 10–14 and portfolio, symphonic and electronic proposals on slides 16–19 of the research presentation; and the composer’s current clarification of the seven-stage application.&quot;],[&quot;《太初》：无极阶段的作品案例&quot;,&quot;Primordial: a case study of the Wuji stage&quot;],[&quot;阶段定位：无极。作品表现混乱的开始，以琵琶与弦乐四重奏探索未分化音响、扩展技法与本原意象。该作品的内部发展属于无极阶段的音响实践；它不按六十四卦逐一对应，也不承担整个七阶段循环。&quot;,&quot;Stage placement: Wuji. The work embodies a chaotic beginning, exploring undifferentiated sound, extended techniques and primordial imagery through pipa and string quartet. Its internal development belongs to Wuji-stage practice; it neither maps the 64 hexagrams individually nor represents the complete seven-stage cycle.&quot;],[&quot;研究定位：七阶段体系适用于单首作品或作品集，编制开放。琵琶与弦乐四重奏是《太初》的具体编制，不是体系对所有作品的限制。&quot;,&quot;Research scope: the seven-stage system applies to a single work or a portfolio with open instrumentation. Pipa and string quartet are the specific forces for Primordial, rather than a restriction on the whole system.&quot;],[&quot;交响乐团 / Symphony orchestra&quot;,&quot;Symphony orchestra&quot;],[&quot;声学与电子结合 / Acoustic + electronics&quot;,&quot;Acoustic instruments with electronics&quot;],[&quot;无极 Wuji&quot;,&quot;Wuji / Non-polarity&quot;],[&quot;混沌未分、无形与不确定音响。&quot;,&quot;Undifferentiated chaos, formlessness and indeterminate sound.&quot;],[&quot;自由或无节拍节奏；噪音织体、环境音、非固定音高；刮奏、特殊拨弦、气鸣与敲击；非线性、弥散开篇。《太初》对应本阶段。&quot;,&quot;Free or unmetered rhythm; noise, environmental and unpitched textures; scraping, unusual plucking, air sounds and impacts; a diffuse nonlinear opening. Primordial belongs to this stage.&quot;],[&quot;太极 Taiji&quot;,&quot;Taiji / Supreme polarity&quot;],[&quot;从混沌中建立可感知的阴阳二元与极化张力。&quot;,&quot;Establish perceptible Yin–Yang duality and polarised tension within chaos.&quot;],[&quot;三全音轴（如 C 与 F♯）、三全音与纯五度对置、半音与全音音场对置；持续共振与碎片点描形成两个张力场。&quot;,&quot;A tritone axis such as C and F-sharp; tritone versus perfect fifth, chromatic versus whole-tone fields; sustained resonance opposed to fragmented pointillism.&quot;],[&quot;两仪 Liangyi&quot;,&quot;Liangyi / Two modes&quot;],[&quot;对立元素交织、对话、追逐与相互渗透。&quot;,&quot;Opposing elements intertwine, converse, pursue and permeate each other.&quot;],[&quot;阳的连续旋律与阴的断奏点描交互；对话、模仿与对位；规则律动和不规则节奏叠置；冲突和声逐步融合。&quot;,&quot;Continuous Yang melody interacts with detached Yin gestures; dialogue, imitation and counterpoint; regular pulse layered with irregular rhythms; gradual integration of conflicting harmonies.&quot;],[&quot;四象 Sixiang&quot;,&quot;Sixiang / Four symbols&quot;],[&quot;四季意象与四种独立音乐性格。&quot;,&quot;Seasonal imagery and four distinct musical characters.&quot;],[&quot;四种调式或音色组：中国五声、印度拉格、中古调式、人工音阶等文化参照；四度叠置、速度与情绪对照；可顺次铺陈或平行叠加。&quot;,&quot;Four modal or timbral groups referencing Chinese pentatonic material, Indian raga, medieval modes or synthetic scales; quartal structures and contrasting tempi and moods; sequential presentation or parallel layering.&quot;],[&quot;八卦 Bagua&quot;,&quot;Bagua / Eight trigrams&quot;],[&quot;八种文化编码的音乐语汇与三音列核心。&quot;,&quot;Eight culturally coded musical vocabularies and trichord nuclei.&quot;],[&quot;按更新规则构建八组三音列：乾 [1–2–3]、坤半音簇、震 [5–1–♭2]、巽 [3–4–6]、坎 [5–6–7]、离 [1–♭3–3]、艮 [2–♭3–5]、兑 [6–1–2]；同时定义节奏、技法与文化取向。&quot;,&quot;Use the revised eight trichords: Qian [1–2–3], Kun chromatic cluster, Zhen [5–1–♭2], Xun [3–4–6], Kan [5–6–7], Li [1–♭3–3], Gen [2–♭3–5], Dui [6–1–2]; define rhythmic, technical and cultural tendencies.&quot;],[&quot;六十四卦 64 Hexagrams&quot;,&quot;64 Hexagrams&quot;],[&quot;双三音列复合、多调式与最大化复调。&quot;,&quot;Paired-trichord synthesis, polymodality and maximal polyphony.&quot;],[&quot;上下卦复合为音场，扩展跨文化人工调式；多调性、泛调性、复合节奏及频谱密度叠加；动爻以单音滑动连接调式，形成循环发展的复杂顶点。&quot;,&quot;Couple upper and lower trigrams into pitch fields and cross-cultural synthetic modes; layer polytonality, pantonality, polyrhythm and spectral density; use moving-line slides to connect modes at the cycle’s complex culmination.&quot;],[&quot;归无极 Return to Wuji&quot;,&quot;Return to Wuji / Cyclic closure&quot;],[&quot;从复杂性消解回混沌、噪音或静默。&quot;,&quot;Dissolve complexity into chaos, noise or silence.&quot;],[&quot;逐渐消退与简化、音高模糊、节奏消散、音色解体；呼应开篇，完成单曲或作品集的循环闭合。归无极是第七个结构位置，与初始无极相呼应。&quot;,&quot;Progressive fading and simplification, pitch blurring, rhythmic dispersal and timbral dissolution; recall the opening to close a work or portfolio cycle. The return is the seventh structural position, echoing the initial Wuji.&quot;]].sort((a,b)=&gt;b[0].length-a[0].length),translationCache=new WeakMap();
